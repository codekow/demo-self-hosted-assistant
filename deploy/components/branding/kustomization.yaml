apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - https://github.com/redhat-na-ssa/demo-ai-gitops-catalog/components/cluster-configs/console-config/overlays/default?ref=main
  - banner-demo.yaml
  - link-gh-demo.yaml

patches:
  - target:
      kind: ConsoleNotification
      name: banner-demo
    patch: |-
      - op: replace
        path: /spec/text
        value: 'DEMO: Self-Hosted Assistant'
